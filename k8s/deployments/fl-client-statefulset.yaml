apiVersion: v1
kind: Service
metadata:
  name: fl-client-headless
  namespace: federated-learning
spec:
  clusterIP: None  # Headless service required for StatefulSet
  selector:
    app: fl-client
  ports:
  - port: 80
    name: client
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fl-clients
  namespace: federated-learning
spec:
  serviceName: fl-client-headless
  replicas: 10  # Scale to 10 clients
  selector:
    matchLabels:
      app: fl-client
  template:
    metadata:
      labels:
        app: fl-client
    spec:
      containers:
      - name: fl-client
        image: fl-client:latest
        imagePullPolicy: Never
        env:
        - name: FL_SERVER_ADDRESS
          value: "fl-server-service:8080"
        - name: CONFIG_PATH
          value: "/app/config/k8s-client.yaml"
        - name: USE_CACHED_DATA
          value: "true"
        - name: CACHED_DATA_PATH
          value: "/shared-data/preprocessed_data.pkl"
        volumeMounts:
        - name: shared-data
          mountPath: /shared-data
        - name: client-config
          mountPath: /app/config
        - name: shared-storage
          mountPath: /app/outputs
        resources:
          requests:
            memory: "1Gi"      # Reduced from 3Gi
            cpu: "500m"        # Reduced from 1000m
          limits:
            memory: "1.5Gi"    # Reduced from 4Gi
            cpu: "1000m"       # Reduced from 2000m
      volumes:
      - name: client-config
        configMap:
          name: fl-client-config
      - name: shared-storage
        persistentVolumeClaim:
          claimName: fl-shared-pvc
      - name: shared-data
        persistentVolumeClaim:
          claimName: dataset-cache-pvc