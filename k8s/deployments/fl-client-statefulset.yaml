apiVersion: v1
kind: Service
metadata:
  name: fl-client-headless
  namespace: federated-learning
spec:
  clusterIP: None  # Headless service required for StatefulSet
  selector:
    app: fl-client
  ports:
  - port: 80
    name: client
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fl-clients
  namespace: federated-learning
spec:
  serviceName: fl-client-headless
  replicas: 3  # Scale to 3 clients
  selector:
    matchLabels:
      app: fl-client
  template:
    metadata:
      labels:
        app: fl-client
    spec:
      containers:
      - name: fl-client
        image: fl-client:v9
        imagePullPolicy: Never
        env:
        - name: FL_SERVER_ADDRESS
          value: "fl-server-service:8080"
        - name: CONFIG_PATH
          value: "/app/config/k8s-client.yaml"
        volumeMounts:
        - name: client-config
          mountPath: /app/config
        - name: shared-storage
          mountPath: /app/outputs
        resources:
          requests:
            memory: "3Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      volumes:
      - name: client-config
        configMap:
          name: fl-client-config
      - name: shared-storage
        persistentVolumeClaim:
          claimName: fl-shared-pvc