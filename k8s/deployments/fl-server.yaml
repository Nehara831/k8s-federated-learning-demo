apiVersion: apps/v1
kind: Deployment
metadata:
  name: fl-server
  namespace: federated-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fl-server
  template:
    metadata:
      labels:
        app: fl-server
    spec:
      restartPolicy: Always  # <-- Must be Always for Deployment!
      containers:
      - name: fl-server
        image: fl-server:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: CONFIG_PATH
          value: "/app/config/k8s-server.yaml"
        - name: USE_CACHED_DATA
          value: "true"
        - name: CACHED_DATA_PATH
          value: "/shared-data/preprocessed_data.pkl"
        volumeMounts:
        - name: server-config
          mountPath: /app/config
        - name: shared-storage
          mountPath: /app/outputs
        - name: dataset-cache
          mountPath: /shared-data
          readOnly: true
        - name: sim-params
          mountPath: /app/initial_params/simulation_initial_params.pkl
          subPath: initial_params.pkl
          readOnly: true
        - name: global-models-output
          mountPath: /app/outputs/global_models
        - name: detector-models
          mountPath: /app/detector_model
          readOnly: true
        - name: src
          mountPath: /app/src
        - name: config
          mountPath: /app/config
        - name: modules
          mountPath: /app/modules
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "3Gi"
            cpu: "2000m"
        
      volumes:
      - name: server-config
        configMap:
          name: fl-server-config
      - name: shared-storage
        persistentVolumeClaim:
          claimName: fl-shared-pvc
      - name: dataset-cache
        persistentVolumeClaim:
          claimName: dataset-cache-pvc
      - name: sim-params
        configMap:
          name: simulation-initial-params
      - name: global-models-output
        hostPath:
          path: /host/global_models
          type: DirectoryOrCreate
      - name: detector-models
        hostPath:
          path: /host/detector_model
          type: Directory
      - name: src
        hostPath:
          path: /app/src
          type: Directory
      - name: config
        hostPath:
          path: /app/config
          type: Directory
      - name: modules
        hostPath:
          path: /app/modules
          type: Directory
