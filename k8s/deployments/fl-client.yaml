apiVersion: apps/v1
kind: Deployment
metadata:
  name: fl-clients
  namespace: federated-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fl-client
  template:
    metadata:
      labels:
        app: fl-client
    spec:
      containers:
      - name: fl-client
        image: fl-client:v4
        imagePullPolicy: Never
        env:
        - name: FL_SERVER_ADDRESS
          value: "fl-server-service:8080"
        - name: CONFIG_PATH
          value: "/app/config/k8s-client.yaml"
        volumeMounts:
        - name: client-config
          mountPath: /app/config
        - name: shared-storage
          mountPath: /app/outputs
        resources:
          requests:
            memory: "2Gi"      # Increased from 512Mi
            cpu: "1000m"       # Increased from 500m
          limits:
            memory: "3Gi"      # Add limit
            cpu: "2000m"
      volumes:
      - name: client-config
        configMap:
          name: fl-client-config
      - name: shared-storage
        persistentVolumeClaim:
          claimName: fl-shared-pvc