apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dataset-cache-pvc
  namespace: federated-learning
spec:
  accessModes:
    - ReadWriteMany  
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: preprocess-dataset
  namespace: federated-learning
spec:
  template:
    metadata:
      labels:
        app: dataset-preprocessor
    spec:
      restartPolicy: Never
      containers:
      - name: preprocessor
        image: fl-server:latest
        imagePullPolicy: Never
        command:
        - python3
        - -c
        - |
          import os
          import pickle
          import logging
          from src.shared.dataset import download_5gnidd_dataset, load_and_preprocess_5gnidd
          
          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger(__name__)
          
          logger.info("Starting dataset preprocessing job...")
          
          # Download dataset
          data_path = '/shared-data'
          os.makedirs(data_path, exist_ok=True)
          
          logger.info("Downloading 5G-NIDD dataset...")
          dataset_path, dataset_files = download_5gnidd_dataset(data_path)
          
          if dataset_path is None:
              logger.error("Failed to download dataset")
              exit(1)
          
          logger.info("Preprocessing dataset...")
          X, y, scaler = load_and_preprocess_5gnidd(dataset_path, dataset_files)
          
          if X is None:
              logger.error("Failed to preprocess dataset")
              exit(1)
          
          # Save preprocessed data
          preprocessed_path = os.path.join(data_path, 'preprocessed_data.pkl')
          logger.info(f"Saving preprocessed data to {preprocessed_path}")
          
          with open(preprocessed_path, 'wb') as f:
              pickle.dump({
                  'X': X,
                  'y': y,
                  'scaler': scaler
              }, f)
          
          logger.info(f"Preprocessing complete! Data shape: X={X.shape}, y={y.shape}")
          logger.info("Dataset is ready for clients to use.")
          
        volumeMounts:
        - name: dataset-cache
          mountPath: /shared-data
        - name: kaggle-creds
          mountPath: /root/.kaggle
          readOnly: true
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "6Gi"
            cpu: "4000m"
      volumes:
      - name: dataset-cache
        persistentVolumeClaim:
          claimName: dataset-cache-pvc
      - name: kaggle-creds
        secret:
          secretName: kaggle-secret
