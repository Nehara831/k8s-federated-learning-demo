dataset:
  type: "5gnidd"
  test_size: 0.2
  seed: 42
  data_dir: "./data"
  num_classes: 9
  
  distribution:
    type: "label_skew"  # Options: 'iid', 'non_iid' (quantity skew), 'label_skew' (label distribution skew)
    quantity_skew_ratio: 3.0  # For 'non_iid': controls imbalance level (higher = more imbalance)
    alpha: 0.1  
    partition_seed: 123  

num_rounds: 5
num_clients: 10
batch_size: 8
num_classes: 9

server:
  port: 8080
  fraction_fit: 1.0
  fraction_evaluate: 1.0
  min_fit_clients: 10
  min_evaluate_clients: 10
  min_available_clients: 10

config_fit:
  lr: 0.01
  momentum: 0.9
  local_epochs: 1

detector:
  enabled: true
  type: "num_distilbert"
  model_path: "/app/detector_model/num_distilbert_best.pt"
  scaler_path: "/app/detector_model/num_distilbert_scaler.pkl"
  threshold: 0.5
  save_dir: "/app/detector_output"
  model:
    model_path: "/app/detector_model/finetuned_model_5gnidd_variant_merged_training"  
  min_rounds_before_detection: 3  
  use_simple_model_if_no_pretrained: false

# ============================================
# S3 METRICS EXPORT CONFIGURATION
# ============================================
s3_export:
  # Enable/disable S3 export
  enabled: true
  
  # AWS S3 bucket where metrics will be uploaded
  bucket: "distil-guard-datalake"
  
  # AWS region (default: us-east-1)
  region: "ap-south-1"
  
  # S3 path prefix where metrics are organized
  # Final path will be: s3://bucket/{prefix}/{session-id}/
  prefix: "sessions/"
  
  # Enable gzip compression for JSON uploads (default: true)
  compress: true
  
  # Local directory to save backup copies of all exported data
  local_export_dir: "/app/temp-data"

