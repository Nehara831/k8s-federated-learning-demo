dataset:
  type: "5gnidd"
  test_size: 0.2
  seed: 42
  data_dir: "./data"

num_rounds: 5
num_clients: 10
batch_size: 8
num_classes: 9

server:
  port: 8080
  fraction_fit: 1.0
  fraction_evaluate: 1.0
  min_fit_clients: 10
  min_evaluate_clients: 10
  min_available_clients: 10

config_fit:
  lr: 0.01
  momentum: 0.9
  local_epochs: 5

detector:
  enabled: true  
  save_dir: "/app/detector_output"
  model:
    model_path: "/app/detector_model/finetuned_model_5gnidd_variant_merged_training"  
  min_rounds_before_detection: 2  
  use_simple_model_if_no_pretrained: false
