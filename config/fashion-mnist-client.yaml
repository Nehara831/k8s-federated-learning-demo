server:
  host: fl-server-service
  port: 8080

dataset:
  type: "fashion_mnist"
  test_size: 0.2
  seed: 42
  data_dir: "/app/data"

num_clients: 10
num_classes: 10
batch_size: 32

attack:
  enabled: true
  attack_type: "model_poisoning"  # Options: model_poisoning, poisoned_fl, label_flip, backdoor
  malicious_ratio: 0.4  # 4 out of 10 clients will be malicious
  attack_params:
    attack_start_round: 3
    attack_probability: 1.0
    poison_global_model: true
    
    # For model_poisoning attack
    poisoning_method: "constant_noise"  # Options: constant_noise, scale, invert, gaussian, zero
    target_layers: "all"  # Options: all, first, last, or [0, 2, 4]
    layer_specific_factor: 1.0
    
    noise_factor: 0.5
    gaussian_mean: 0.0
    gaussian_std: 1.0
    
    scale:
      scale_factor: 1.4
    
    constant_noise:
      constant_noise_value: 1.1
    
    label_flip:
      flip_strategy: "targeted"  # Options: targeted, random, class_confusion
      flip_ratio: 0.5
      target_label: 0
      source_label: null
      num_classes: 10
    
    poisoned_fl:
      sign_vector_seed: 42  # CRITICAL: Must be same for all malicious clients
      initial_lambda: 8.0
      lambda_increase_factor: 1.0
      lambda_decrease_factor: 0.7
      cosine_threshold: 0.5
      malicious_ratio: 0.4
      benign_warmup: 1
      minimum_lambda: 0.5
