dataset:
  type: "fashion_mnist"
  test_size: 0.2
  seed: 42
  data_dir: "./data"

num_rounds: 10
num_clients: 10
batch_size: 32
num_classes: 10

server:
  port: 8080
  fraction_fit: 1.0
  fraction_evaluate: 1.0
  min_fit_clients: 10
  min_evaluate_clients: 10
  min_available_clients: 10

config_fit:
  lr: 0.01
  momentum: 0.9
  local_epochs: 5

# Use detector trained on MNIST to test cross-dataset generalization
detector:
  enabled: true
  type: "num_distilbert"  # Trained on MNIST, testing on Fashion-MNIST
  model_path: "/app/detector_model/num_distilbert_best.pt"
  scaler_path: "/app/detector_model/num_distilbert_scaler.pkl"
  threshold: 0.5
  save_dir: "/app/detector_output"
  model:
    model_path: "/app/detector_model/finetuned_model_5gnidd_variant_merged_training"  
  min_rounds_before_detection: 3  
  use_simple_model_if_no_pretrained: false
